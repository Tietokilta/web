name: Nix dev shell
on:
  # Renovate refreshes flake.lock and auto-merges it, so check the shell still builds
  pull_request:
    paths: [flake.nix, flake.lock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Dev shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Enter the dev shell
        run: nix develop . --no-pure-eval --accept-flake-config -c sh -c 'node --version && pnpm --version && mongosh --version && mongoimport --version'
