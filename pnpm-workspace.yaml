packages:
  - apps/*
  - packages/*
  - e2e

catalog:
  "@tailwindcss/postcss": ^4.3.2
  "@tailwindcss/typography": ^0.5.20
  "@types/node": ^26.0.0
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  clsx: ^2.1.1
  postcss: ^8.5.16
  react: ^19.2.7
  react-dom: ^19.2.7
  sharp: ^0.35.3
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.2
  tailwindcss-animate: ^1.0.7
  next: ^16.3.8
  typescript: ~6.0.3

# https://pnpm.io/supply-chain-security
minimumReleaseAge: 1440

autoInstallPeers: true

# Drop catalog entries that no package uses anymore
catalogPrune: true

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  cpu-features: false
  es5-ext: true
  esbuild: true
  protobufjs: false
  sharp: true
  ssh2: false

# fallow's agent skills duplicate its `fallow --help`, so don't link them
permissions:
  fallow:
    skills: false
